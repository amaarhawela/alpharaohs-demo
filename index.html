<style>
:root{--navy:#0f1537;--navy2:#1b2262;--blue:#2c348a;--gold:#e8b730;--gold2:#f6d77a;--cream:#fbf6ea;--ink:#171a33;--red:#c8312b;--muted:#6b6f8a;--line:rgba(15,21,55,.12);
--ff-ar:'Cairo',sans-serif;--ff-en:'Inter',sans-serif;--ff-disp:'Fraunces','Cairo',serif;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff-ar);background:var(--cream);color:var(--ink);line-height:1.7;overflow-x:hidden}
html[lang=en] body{font-family:var(--ff-en)}
h1,h2,h3{font-family:var(--ff-disp);line-height:1.15;letter-spacing:-.01em}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{font-family:var(--ff-ar);font-weight:900;line-height:1.35}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
section{padding:110px 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:.95rem}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--gold)}
.h2{font-size:clamp(2rem,4.2vw,3.2rem);margin:14px 0 18px}
.lead{color:var(--muted);font-size:1.08rem;max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;font-weight:700;font-size:.98rem;border:0;cursor:pointer;transition:.3s transform,.3s box-shadow,.3s background;font-family:inherit}
.btn:hover{transform:translateY(-3px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);box-shadow:0 10px 30px -8px rgba(232,183,48,.7)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.btn-navy{background:var(--navy);color:#fff}
/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;padding:14px 0;transition:.4s}
header.scrolled{background:rgba(15,21,55,.88);backdrop-filter:blur(14px);padding:8px 0;box-shadow:0 8px 30px -10px rgba(0,0,0,.5)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center}.logo img{height:54px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));transition:.3s}
header.scrolled .logo img{height:44px}
.links{display:flex;gap:30px;color:#fff;font-weight:600}
.links a{position:relative;padding:4px 0;opacity:.88}.links a:hover{opacity:1}
.links a::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transition:.3s;transform-origin:center}
.links a:hover::after{transform:scaleX(1)}
.tools{display:flex;align-items:center;gap:12px}
.lang{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 16px;border-radius:99px;font-weight:700;cursor:pointer;font-family:inherit;transition:.3s}
.lang:hover{background:var(--gold);color:var(--navy)}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.7rem;cursor:pointer}
/* hero */
.hero{min-height:100svh;padding:140px 0 90px;background:radial-gradient(1200px 700px at 78% 20%,#2b36a3 0%,transparent 60%),radial-gradient(900px 600px at 10% 90%,#6a1c1c 0%,transparent 55%),linear-gradient(160deg,var(--navy),#080c26);color:#fff;overflow:hidden;display:flex;align-items:center}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.hero h1{font-size:clamp(2.6rem,6vw,5rem);margin:18px 0 22px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:rgba(255,255,255,.78);font-size:1.15rem}
.hero .eyebrow{color:var(--gold2)}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.stats{display:flex;gap:34px;margin-top:50px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--ff-disp);font-size:2.4rem;color:var(--gold);line-height:1}
.stat span{font-size:.88rem;color:rgba(255,255,255,.7)}
.stage{position:relative;height:560px}
.sack{position:absolute;border-radius:24px;overflow:hidden;box-shadow:0 40px 70px -20px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.18);will-change:transform}
.sack img{width:100%;height:100%;object-fit:cover}
.sack.a{width:54%;height:78%;top:8%;inset-inline-start:23%;z-index:3;animation:fl 7s ease-in-out infinite}
.sack.b{width:40%;height:52%;top:0;inset-inline-end:0;z-index:2;animation:fl 8s ease-in-out -2s infinite}
.sack.c{width:42%;height:52%;bottom:0;inset-inline-start:0;z-index:2;animation:fl 9s ease-in-out -4s infinite}
.sack.d{width:30%;height:36%;bottom:4%;inset-inline-end:2%;z-index:4;animation:fl 6s ease-in-out -1s infinite}
@keyframes fl{50%{transform:translateY(-18px) rotate(1.2deg)}}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(232,183,48,.35),transparent 65%);inset-inline-start:15%;top:15%;filter:blur(20px);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.2);opacity:.6}}
.seeds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.seeds i{position:absolute;top:-20px;width:7px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--gold);opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.wave{position:absolute;bottom:-1px;left:0;width:100%;height:70px;display:block}
/* marquee */
.marquee{background:var(--gold);color:var(--navy);padding:16px 0;overflow:hidden;white-space:nowrap;font-weight:900;font-size:1.15rem;transform:rotate(-1deg);margin:-30px -20px 0;position:relative;z-index:5;box-shadow:0 14px 30px -15px rgba(0,0,0,.4)}
.marquee div{display:inline-block;animation:mq 38s linear infinite}
html[dir=rtl] .marquee div{animation-direction:reverse}
.marquee span{margin:0 26px}.marquee span::after{content:"✦";margin-inline-start:52px;color:var(--red)}
@keyframes mq{to{transform:translateX(-50%)}}
/* about */
.about .grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.about-media{position:relative;height:520px}
.about-media .p1{position:absolute;inset-inline-start:0;top:0;width:68%;height:82%;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -25px rgba(15,21,55,.5)}
.about-media .p2{position:absolute;inset-inline-end:0;bottom:0;width:52%;height:58%;border-radius:var(--r);overflow:hidden;border:8px solid var(--cream);box-shadow:0 30px 60px -25px rgba(15,21,55,.5)}
.about-media img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;inset-inline-end:8%;top:6%;background:var(--navy);color:var(--gold);width:128px;height:128px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900;border:3px dashed var(--gold);animation:spin 30s linear infinite;z-index:3}
.badge div{animation:spin 30s linear infinite reverse;line-height:1.1}.badge b{display:block;font-size:2rem;font-family:var(--ff-disp)}
@keyframes spin{to{transform:rotate(360deg)}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.fact{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;transition:.3s}
.fact:hover{transform:translateY(-5px);box-shadow:0 20px 40px -20px rgba(15,21,55,.35)}
.fact b{font-size:2rem;font-family:var(--ff-disp);color:var(--blue);display:block;line-height:1.1}
.fact span{color:var(--muted);font-size:.92rem}
.mgr{margin-top:24px;padding-inline-start:18px;border-inline-start:3px solid var(--gold);color:var(--muted)}
.mgr b{color:var(--ink)}
/* markets */
.markets{background:var(--navy);color:#fff;overflow:hidden}
.markets .eyebrow{color:var(--gold2)}.markets .lead{color:rgba(255,255,255,.7)}
.mk{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px}
.chip{display:flex;align-items:center;gap:12px;padding:16px 26px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-weight:700;font-size:1.1rem;position:relative;transition:.3s}
.chip:hover{background:var(--gold);color:var(--navy);transform:translateY(-4px)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(232,183,48,.7);animation:ping 2.2s infinite}
@keyframes ping{to{box-shadow:0 0 0 14px rgba(232,183,48,0)}}
.fairs{margin-top:60px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.fair{padding:26px;border-radius:var(--r);border:1px solid rgba(255,255,255,.14);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02))}
.fair b{font-family:var(--ff-disp);font-size:1.4rem;color:var(--gold)}.fair span{display:block;opacity:.7;font-size:.9rem}
/* products */
.prod-head{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;margin-bottom:46px}
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;transform-style:preserve-3d}
.card:hover{transform:translateY(-10px);box-shadow:0 34px 60px -28px rgba(15,21,55,.55);border-color:var(--gold)}
.card .im{aspect-ratio:4/4.6;overflow:hidden;background:#e9e3d2;position:relative}
.card .im img{width:100%;height:100%;object-fit:cover;transition:1s}
.card:hover .im img{transform:scale(1.09) rotate(.6deg)}
.card .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(15,21,55,.55))}
.tag{position:absolute;z-index:2;inset-inline-start:14px;top:14px;background:var(--gold);color:var(--navy);font-weight:900;padding:5px 14px;border-radius:99px;font-size:.85rem;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.card .tx{padding:20px 22px 24px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.2rem}
.card p{color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:auto;padding-top:10px;color:var(--blue);font-weight:700;display:flex;gap:8px;align-items:center}
.more i{transition:.3s;font-style:normal}.card:hover .more i{transform:translateX(6px)}
html[dir=rtl] .card:hover .more i{transform:translateX(-6px)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,12,38,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex;animation:fi .3s}
@keyframes fi{from{opacity:0}}
.mbox{background:var(--cream);border-radius:28px;max-width:900px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative;animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px) scale(.96);opacity:0}}
.mbox img{width:100%;height:100%;min-height:360px;object-fit:cover}
.mbox .b{padding:44px 38px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.mbox h3{font-size:2rem}
.price{display:inline-flex;align-self:flex-start;gap:8px;align-items:baseline;background:var(--navy);color:var(--gold);padding:10px 22px;border-radius:99px;font-weight:900;font-size:1.3rem}
.price small{opacity:.7;font-size:.8rem;color:#fff;font-weight:600}
.x{position:absolute;inset-inline-end:16px;top:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(15,21,55,.85);color:#fff;font-size:1.3rem;cursor:pointer;z-index:2}
/* gallery */
.gallery{background:#f1ead6;overflow:hidden}
.strip{display:flex;gap:18px;margin-top:40px;animation:mq 60s linear infinite;width:max-content}
html[dir=rtl] .strip{animation-direction:reverse}
.strip:hover{animation-play-state:paused}
.strip img{height:360px;width:270px;object-fit:cover;flex:none;border-radius:20px;box-shadow:0 20px 40px -22px rgba(15,21,55,.6)}
@media(max-width:900px){.strip img{height:280px;width:210px}}
/* contact */
.contact .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:50px}
.ci{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.row{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);padding:18px 22px;border-radius:18px;transition:.3s}
.row:hover{border-color:var(--gold);transform:translateX(6px)}html[dir=rtl] .row:hover{transform:translateX(-6px)}
.ic{width:46px;height:46px;border-radius:14px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:1.2rem;flex:none}
.row small{display:block;color:var(--muted);font-size:.8rem}.row b{direction:ltr;unicode-bidi:plaintext}
.map{border-radius:var(--r);overflow:hidden;min-height:440px;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(15,21,55,.5);display:flex;flex-direction:column;background:#fff}
.map iframe{border:0;width:100%;flex:1;min-height:380px}
.map .bar{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
footer{background:var(--navy);color:rgba(255,255,255,.75);padding:50px 0 30px}
footer .f{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer img{height:56px}
.copy{margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:.85rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wa{position:fixed;inset-inline-end:22px;bottom:22px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:1.7rem;box-shadow:0 14px 30px -8px rgba(37,211,102,.7);animation:pulse2 2.4s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 16px rgba(37,211,102,0)}}
.rv{opacity:0;transform:translateY(34px);transition:1s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.wi{width:1.2em;height:1.2em;fill:currentColor;flex:none;vertical-align:-.22em}.wa .wi{width:32px;height:32px}.ic .wi{width:22px;height:22px}
.hpy{position:absolute;inset-inline-end:-40px;bottom:60px;width:min(620px,70vw);opacity:.09;pointer-events:none}.hpy path{fill:none;stroke:#f6d77a;stroke-width:1.6}footer{border-top:6px solid;border-image:linear-gradient(90deg,#2c348a 0 25%,#e8b730 25% 50%,#c8312b 50% 75%,#2f8f4e 75% 100%) 1}
#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:99;background:linear-gradient(90deg,var(--gold),var(--red));transform-origin:left;transform:scaleX(0)}
html[dir=rtl] #prog{transform-origin:right}
.wmap{position:relative;margin-top:44px;border-radius:var(--r);overflow:hidden;padding-top:41.67%;background:radial-gradient(800px 300px at 60% 50%,rgba(44,52,138,.55),transparent 70%),rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12)}
.wmap>img{max-width:none;position:absolute;left:-30%;top:-16%;width:166.667%;filter:invert(1);opacity:.16}
.wmap svg{position:absolute;inset:0;width:100%;height:100%}
.arc{fill:none;stroke-width:1.6;stroke-linecap:round}
.arc.ex{stroke:var(--gold);stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
.arc.im{stroke:#9fb2ff;stroke-dasharray:2 7;animation:dash 2.4s linear infinite reverse}
@keyframes dash{to{stroke-dashoffset:-24}}
.pt{fill:var(--gold)}.pt.im{fill:#9fb2ff}.ring{fill:none;stroke:var(--gold);transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(3.2);opacity:0}}
.lb{font:700 11px var(--ff-ar);fill:#fff;paint-order:stroke;stroke:rgba(8,12,38,.8);stroke-width:3px}
.legend{position:absolute;inset-inline-start:16px;bottom:12px;display:flex;gap:18px;font-size:.82rem;font-weight:700;color:rgba(255,255,255,.85)}
.legend i{display:inline-block;width:26px;height:0;border-top:3px dashed var(--gold);vertical-align:middle;margin-inline-end:8px}.legend i.im{border-color:#9fb2ff}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:50px;position:relative}
.steps::before{content:"";position:absolute;top:34px;inset-inline:8%;border-top:2px dashed rgba(15,21,55,.25)}
.step{position:relative;text-align:center;padding:0 8px}
.step .n{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 1.4rem var(--ff-disp);border:4px solid var(--cream);box-shadow:0 0 0 2px var(--gold);transition:.4s}
.step:hover .n{transform:scale(1.12) rotate(-6deg);background:var(--gold);color:var(--navy)}
.step h3{font-size:1.15rem;margin-bottom:6px}.step p{color:var(--muted);font-size:.93rem}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:-14px 0 30px}
.fl{border:1px solid var(--line);background:#fff;padding:9px 20px;border-radius:99px;font-weight:700;cursor:pointer;font-family:inherit;transition:.25s;color:var(--ink)}
.fl:hover{border-color:var(--gold)}.fl.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.quote{background:linear-gradient(160deg,var(--navy),#080c26);color:#fff;overflow:hidden}
.quote .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.quote .eyebrow{color:var(--gold2)}.quote .lead{color:rgba(255,255,255,.72)}
.qf{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:30px;display:grid;gap:14px;backdrop-filter:blur(8px)}
.qf .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qf label{display:grid;gap:6px;font-weight:700;font-size:.88rem}
.qf input,.qf select,.qf textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(8,12,38,.55);color:#fff;font:inherit;outline:0;transition:.25s}
.qf input:focus,.qf select:focus,.qf textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,183,48,.25)}
.qf select option{color:#000}.qf textarea{min-height:90px;resize:vertical}
.qf small{opacity:.65}
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(760px 520px at 50% 52%,#262f86 0%,transparent 70%),radial-gradient(520px 320px at 50% 100%,rgba(200,49,43,.2),transparent 70%),#0a0f2e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;clip-path:circle(150% at 50% 50%);transition:clip-path 1.1s cubic-bezier(.77,0,.18,1) .15s}
#intro.out{clip-path:circle(0% at 50% 50%)}
#intro .py{width:min(380px,78vw);height:auto;overflow:visible;margin-bottom:-6px}

(function(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
